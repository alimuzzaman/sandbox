name: Desktop macOS evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/desktop/**"
      - "src/web/**"
      - "docs/desktop-app.md"
      - ".github/workflows/desktop-macos.yml"

permissions:
  contents: read

jobs:
  unsigned-universal:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/desktop/package-lock.json
            src/web/package-lock.json
      - name: Verify web source
        working-directory: src/web
        run: npm ci && npm run typecheck && npm run build
      - name: Audit and test desktop
        working-directory: src/desktop
        run: npm ci && npm audit --audit-level=high && npm test
      - name: Build unsigned universal artifacts
        working-directory: src/desktop
        run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-desktop-macos-unsigned
          path: |
            src/desktop/release/*.dmg
            src/desktop/release/*.zip
            src/desktop/release/RELEASE-MANIFEST.json
          if-no-files-found: error
