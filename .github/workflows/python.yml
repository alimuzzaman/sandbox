name: Python acceptance

on:
  pull_request:
  push:
    branches:
      - latest

permissions:
  contents: read

jobs:
  python:
    name: Sandbox Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create CLI test environment
        run: |
          python -m venv .cli-venv
          .cli-venv/bin/python -m pip install --disable-pip-version-check PyYAML

      - name: Show exact revision
        run: git rev-parse HEAD

      - name: Run Sandbox Python acceptance
        run: ./sb selftest
