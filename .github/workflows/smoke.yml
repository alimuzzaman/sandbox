name: Smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sandbox/core/_instances.py'
      - 'sandbox/commands/lifecycle.py'
      - 'sandbox/commands/instances_cmd.py'
      - 'sandbox/runtimes/**'
      - 'tools/proxy-helper.sh'
      - '.github/workflows/smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Clean-room install + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prerequisites
        run: |
          python3 --version
          python3 -m venv --help > /dev/null
          docker --version
          docker compose version

      # The smoke checks the default clean URL, which needs the one-time
      # clean-URL setup an operator does interactively (`./sb domains setup`:
      # the helper and a trusted mkcert CA), and `proxy-helper.sh
      # dns-up` serves only a plain /etc/resolv.conf (it declines one owned by
      # systemd-resolved, as on these runners). Give the runner both.
      - name: Prepare clean-URL host
        run: |
          # ensure gives a new instance its clean URL through mkcert (HTTPS);
          # without it the instance stays on localhost.
          sudo apt-get install -y --no-install-recommends dnsmasq-base mkcert libnss3-tools
          mkcert -install
          sudo ./tools/proxy-helper.sh install
          if [ -L /etc/resolv.conf ]; then
            upstream=$(readlink -f /run/systemd/resolve/resolv.conf)
            sudo rm /etc/resolv.conf
            sudo cp "$upstream" /etc/resolv.conf
          fi

      # Docker is already running on ubuntu-latest runners.
      # PyYAML and other runtime deps are fetched on demand by `sb`.
      - name: Run smoke test
        run: ./sb smoke

      - name: Clean-URL host diagnostics
        if: failure()
        run: |
          ls -l /etc/resolv.conf; cat /etc/resolv.conf
          sudo -n /usr/local/libexec/sandbox-proxy-helper installed-status || true
          ls -l /etc/sudoers.d/ || true
          ss -ltnu | grep ':53 ' || true
          getent hosts sb-smoke-probe.tst || echo "sb-smoke-probe.tst does not resolve"
          docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}'
