# Generated/maintained by the sandbox — nginx site config for the `nginx`
# server variant. Mounted at /etc/nginx/conf.d/default.conf. Pairs with the
# php-fpm `wp` service (wordpress:*-fpm) reachable as wp:9000.
#
# Both nginx and the fpm container mount the SAME WP files at /var/www/html,
# which is what makes SCRIPT_FILENAME below resolve.

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Match the PHP upload/post limits in config/php-sandbox.ini.
    client_max_body_size 64m;

    # Multisite (subdirectory) support: strip the leading site segment so
    # /site2/wp-admin/… and /site2/wp-content/… resolve to the real core
    # paths. Inert for single-site instances — the rewrites only fire when
    # the literal path doesn't exist on disk.
    if (!-e $request_filename) {
        rewrite /wp-admin$ $scheme://$host$request_uri/ permanent;
        rewrite ^/[_0-9a-zA-Z-]+(/wp-.*) $1 last;
        rewrite ^/[_0-9a-zA-Z-]+(/.*\.php)$ $1 last;
    }

    # WordPress front controller. This single block makes BOTH /%postname%/
    # permalinks AND /wp-json/ REST routes work — wp-json is not a real
    # directory, it falls through to index.php where WP routes it. Do NOT add
    # a dedicated `location /wp-json` — that breaks it.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Hand .php to the fpm container. `wp` = compose service name, 9000 = fpm.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wp:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Must be the path as the fpm container sees it — identical mount path.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;
    }

    # Let nginx serve static assets directly.
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Harden: hidden files (except ACME), wp-config, and PHP under uploads.
    location ~ /\.(?!well-known) { deny all; }
    location = /wp-config.php { deny all; }
    location ~* /(?:wp-content|wp-includes)/.*\.php$ { deny all; }
}
