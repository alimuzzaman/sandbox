; Auto-loaded into both the wp (apache) and wpcli containers via
; docker-compose. Override the PHP defaults that are too tight for the
; WPDeveloper plugin family (Essential Addons / Elementor / WooCommerce
; all blow past 128M during activation; large media imports need bigger
; upload/post sizes).
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 1024M
post_max_size = 1024M
