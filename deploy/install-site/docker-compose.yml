# Sandbox install site — serves the public one-line installer + release tarball.
#
#   curl -fsSL https://sandbox.xc1.app/install.sh | sh
#
# Deploy-ready, HTTP-only, behind Cloudflare (TLS terminates at the edge → this
# origin). A tiny nginx container serving ./public (install.sh + the tarball).
#
# Deploy on the server (45.63.18.41):
#   1) git pull / copy this deploy/install-site dir to the server
#   2) SANDBOX_BASE_URL=https://sandbox.xc1.app ./publish.sh   # stage ./public
#   3) docker compose up -d                                    # serve on :8088
#   4) Cloudflare: DNS A `sandbox` → 45.63.18.41 (proxied), and route/origin
#      to this box's :8088 (or front it with the host nginx → proxy_pass :8088).
#
# To publish a new release later: re-run ./publish.sh (rebuilds the tarball +
# install.sh); nginx serves the new files immediately (no restart needed).
name: sandbox-install-site

services:
  web:
    image: nginx:1.27-alpine
    container_name: sandbox-install-site
    restart: unless-stopped
    ports:
      # Cloudflare/edge terminates TLS and forwards here over HTTP. Change the
      # host port if 8088 is taken; keep it bound to all interfaces so the edge
      # (or the host's reverse proxy) can reach it.
      - "8088:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/install.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
