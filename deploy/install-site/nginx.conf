# Serves the sandbox installer + release tarball from /usr/share/nginx/html.
# Designed to sit behind Cloudflare (TLS at the edge) → HTTP here on :80.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # install.sh has no extension served as a script → force shell content type
    # so `curl | sh` and browsers treat it as plain text, not download-as-binary.
    location = /install.sh {
        default_type text/x-shellscript;
        add_header Cache-Control "no-cache";   # always serve the latest installer
    }

    # The release tarball — let it cache a little at the edge.
    location ~ \.tar\.gz$ {
        default_type application/gzip;
        add_header Cache-Control "public, max-age=300";
    }

    # A friendly root page (optional) — falls back to the installer hint.
    location = / {
        default_type text/plain;
        return 200 "Sandbox installer.\nRun:  curl -fsSL https://$host/install.sh | sh\n";
    }

    location / { try_files $uri =404; }
}

