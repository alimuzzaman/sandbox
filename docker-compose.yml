name: sandbox

services:
  wp:
    image: wordpress:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - ./runtime/wp:/var/www/html
      - ./runtime/seeds:/seeds
      # Bind-mount plugin sources at the same absolute host path so the
      # symlinks `./wp-sandbox add` creates under wp-content/plugins/ resolve
      # inside the container. SANDBOX_PLUGINS_HOST is materialized into .env
      # by `./wp-sandbox` on every run.
      - ${SANDBOX_PLUGINS_HOST}:${SANDBOX_PLUGINS_HOST}

  db:
    image: mariadb:latest
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "1025"

  wpcli:
    image: wordpress:cli
    depends_on:
      - wp
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - ./runtime/wp:/var/www/html
      - ./runtime/seeds:/seeds
      - ${SANDBOX_PLUGINS_HOST}:${SANDBOX_PLUGINS_HOST}
    entrypoint: ["wp", "--allow-root"]
    command: ["--info"]

volumes:
  db_data:
