# Sandbox — single source of truth for the WPDeveloper plugin dev environment.
# Edit this file, then run `./sb apply` to take effect.
#
# Audience: designers, developers, QA across the whole company.
# Anything humans configure lives here. Things LLMs consume (skills,
# workflows) stay as markdown elsewhere.

version: 1

# ---------------------------------------------------------------------------
# Defaults — referenced as ${VAR} below.
# Override per-machine in `sandbox.local.yml` (gitignored).
# ---------------------------------------------------------------------------
defaults:
  # Where plugin repos live. Default keeps everything inside the sandbox folder
  # (./plugins/). Override in sandbox.local.yml if you already have your repos
  # cloned elsewhere — e.g.  plugins_home: "$HOME/dev"
  plugins_home: "./plugins"
  # GitHub org used as the fallback when a plugin entry doesn't specify its own
  # `github:` field. For the WPDeveloper team this is "WPDevelopers" (capital W,
  # plural). For external users / forks: your own org/user. `./sb connect gh`
  # writes this into sandbox.local.yml.
  github_org: ""

# ---------------------------------------------------------------------------
# Runtime — docker stack
# ---------------------------------------------------------------------------
runtime:
  wordpress_port: 8188
  db_port: 3318
  mailpit_port: 8125

  wordpress_image: "wordpress:latest"
  mariadb_image: "mariadb:latest"
  wpcli_image: "wordpress:cli"

  admin:
    user: admin
    password: admin
    email: admin@example.com
    site_title: Sandbox

# ---------------------------------------------------------------------------
# Projects — choose one with `./sb use <name>`.
#
# A project bundles:
#   - which plugins to activate, in which order
#   - where each plugin's source repo lives on disk (symlinked in)
#   - any wp.org plugins to auto-install as runtime dependencies
#
# Per-plugin fields:
#   slug:     WordPress plugin slug (matches the folder name in wp-content/plugins).
#   source:   absolute path to the git checkout on disk (symlinked into the stack).
#   github:   <org>/<repo> on GitHub. Used by `./sb pick` / `./sb add` to clone
#             when `source` doesn't exist yet. Falls back to `${github_org}/${slug}`
#             when omitted — set this whenever the GitHub repo name differs from
#             the WP slug (e.g. wowstore vs productx, eael-pro vs essential-addons-elementor).
#
# Ship one project per plugin (or per workflow). Add more freely.
# ---------------------------------------------------------------------------
projects:

  embedpress:
    description: EmbedPress free + Pro.
    plugins:
      - slug: embedpress
        github: "WPDevelopers/embedpress"
        source: "${plugins_home}/embedpress"
      - slug: embedpress-pro
        github: "WPDevelopers/embedpress-pro"
        source: "${plugins_home}/embedpress-pro"
    install_from_wporg:
      - elementor
      - safe-svg          # sanitize SVG uploads — required for any design work

  essential-blocks:
    description: Essential Blocks for Gutenberg free + Pro.
    plugins:
      - slug: essential-blocks
        github: "WPDevelopers/essential-blocks"
        source: "${plugins_home}/essential-blocks"
      - slug: essential-blocks-pro
        github: "WPDevelopers/essential-blocks-pro"
        source: "${plugins_home}/essential-blocks-pro"

  essential-addons:
    description: Essential Addons for Elementor — Lite + Pro.
    plugins:
      - slug: essential-addons-for-elementor-lite
        github: "WPDevelopers/essential-addons-for-elementor-lite"
        source: "${plugins_home}/essential-addons-for-elementor-lite"
      - slug: essential-addons-elementor
        github: "WPDevelopers/essential-addons-elementor"
        source: "${plugins_home}/essential-addons-elementor"
    install_from_wporg:
      - elementor
      - safe-svg

  betterdocs:
    description: BetterDocs core + Pro + AI Chatbot + OAuth.
    plugins:
      - slug: betterdocs
        github: "WPDevelopers/betterdocs"
        source: "${plugins_home}/betterdocs"
      - slug: betterdocs-pro
        github: "WPDevelopers/betterdocs-pro"
        source: "${plugins_home}/betterdocs-pro"
      - slug: betterdocs-ai-chatbot
        github: "WPDevelopers/betterdocs-ai-chatbot"
        source: "${plugins_home}/betterdocs-ai-chatbot"
      - slug: betterdocs-oauth
        github: "WPDevelopers/betterdocs-oauth"
        source: "${plugins_home}/betterdocs-oauth"

  betterlinks:
    description: BetterLinks free + Pro.
    plugins:
      - slug: betterlinks
        github: "WPDevelopers/betterlinks"
        source: "${plugins_home}/betterlinks"
      - slug: betterlinks-pro
        github: "WPDevelopers/betterlinks-pro"
        source: "${plugins_home}/betterlinks-pro"

  notificationx:
    description: NotificationX free + Pro.
    plugins:
      - slug: notificationx
        github: "WPDevelopers/notificationx"
        source: "${plugins_home}/notificationx"
      - slug: notificationx-pro
        github: "WPDevelopers/notificationx-pro"
        source: "${plugins_home}/notificationx-pro"

  schedulepress:
    description: SchedulePress / WP Scheduled Posts (free only).
    plugins:
      - slug: wp-scheduled-posts
        github: "WPDevelopers/wp-scheduled-posts"
        source: "${plugins_home}/wp-scheduled-posts"

  disable-comments:
    description: Disable Comments + MU + Disable Feeds (free only).
    plugins:
      - slug: disable-comments
        github: "WPDevelopers/disable-comments"
        source: "${plugins_home}/disable-comments"
      - slug: disable-comments-mu
        github: "WPDevelopers/disable-comments-mu"
        source: "${plugins_home}/disable-comments-mu"
      - slug: disable-feeds
        github: "WPDevelopers/disable-feeds"
        source: "${plugins_home}/disable-feeds"

  xspeed:
    description: XSpeed caching plugin.
    plugins:
      - slug: xspeed
        github: "WPDevelopers/xspeed"
        source: "${plugins_home}/xspeed"

  # standalone:
  #   description: Misc standalone WPDeveloper plugins (SEO / redirects / meta).
  #   plugins:
