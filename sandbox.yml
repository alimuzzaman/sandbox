# Sandbox — single source of truth for the WPDeveloper plugin dev environment.
# Edit this file, then run `./sb apply` to take effect.
#
# Audience: designers, developers, QA across the whole company.
# Anything humans configure lives here. Things LLMs consume (skills,
# workflows) stay as markdown elsewhere.

version: 0.1.0

# ---------------------------------------------------------------------------
# Defaults — referenced as ${VAR} below.
# Override per-machine in `sandbox.local.yml` (gitignored).
# ---------------------------------------------------------------------------
defaults:
  # Where plugin repos live. Default keeps everything inside the sandbox folder
  # (./plugins/). Override in sandbox.local.yml if you already have your repos
  # cloned elsewhere — e.g.  plugins_home: "$HOME/dev"
  plugins_home: "./plugins"
  # GitHub org used as the fallback when a plugin entry doesn't specify its own
  # `github:` field. For the Templately team this is "templately". For external
  # users / forks: your own org/user. `./sb connect gh` writes this into
  # sandbox.local.yml.
  github_org: ""

# ---------------------------------------------------------------------------
# Runtime — docker stack
#
# These values become the defaults for the implicit `main` instance.
# Each instance defined under `instances:` below inherits unset fields
# from this block.
# ---------------------------------------------------------------------------
runtime:
  wordpress_port: 8188
  db_port: 3318
  mailpit_port: 8125

  wordpress_image: "wordpress:latest"
  mariadb_image: "mariadb:latest"
  wpcli_image: "wordpress:cli"

  # Web server stack for instances that don't override it.
  #   nginx     (default) — wordpress:*-fpm + nginx sidecar
  #   apache    — wordpress:latest, Apache + mod_php, .htaccess
  #   litespeed — OpenLiteSpeed (lsphp); pre-installed LiteSpeed Cache is
  #               auto-deactivated on install so it can't shadow xSpeed
  server: nginx

  admin:
    user: admin
    password: admin
    email: admin@example.com
    site_title: Sandbox

# ---------------------------------------------------------------------------
# Storage pressure monitor — machine-wide observation defaults.
# `auto_enabled` and `reap_enabled` are deletion authority; both stay OFF
# until an operator opts a target in through sandbox.local.yml.
# ---------------------------------------------------------------------------
resources:
  monitor:
    warn_ratio: 0.15
    critical_ratio: 0.05
    auto_enabled: false
    auto_tier: safe
    auto_ratio: null
    reap_enabled: false
    reap_ttl: null
    schedule_calendar: hourly
    schedule_randomized_delay: 5min
    schedule_timeout: 30min
    record_max_age_seconds: 21600

# ---------------------------------------------------------------------------
# Instances. In the per-project model you don't hand-author these: `./sb init`
# / `./sb ensure` inside a plugin repo create one instance per project dir and
# record it (ports, server, version pins) under `instances:` in
# sandbox.local.yml, tracked in the registry. Without any instance, a single
# `main` is synthesized from the `runtime:` block above. CLI commands can still
# target a specific instance with `./sb --instance <name> <cmd>`; MCP tools
# route by `project_dir` instead.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# No central project catalog. (Removed in the MCP-first per-project rewrite,
# T2.4.) Each plugin repo now carries its own sandbox.config.json; `cd` into
# it and run `./sb init` (or `./sb ensure`) — the registry tracks one instance
# per project dir. The old `projects:` catalog + `./sb projects|pick|use|add`
# live at commit 25fc4094280f66ad78600548c003e7b7aea46dea (`git show 25fc409:sb`).
# ---------------------------------------------------------------------------



# ---------------------------------------------------------------------------
# MCP servers — which contracts are exposed to LLMs.
# ---------------------------------------------------------------------------
mcp:
  wp:
    enabled: true
    # Generate at /wp-admin/profile.php → "Application Passwords" after
    # `./sb install`. Required for wp_rest tool only.
    application_password: ""

  browser:
    enabled: false           # not implemented yet
  figma:
    enabled: false           # not implemented yet

# ---------------------------------------------------------------------------
# Personal secrets — populated by `./sb onboard`.
#
# Never edit this block here; the wizard writes the real values into
# `sandbox.local.yml` (gitignored) and mirrors them into `.env.local` for
# scripts/skills that prefer dotenv.
#
# fluentboards:
#   url: https://office.example.com
#   email: you@example.com
#   app_password: xxxx xxxx xxxx xxxx xxxx xxxx
# ---------------------------------------------------------------------------
