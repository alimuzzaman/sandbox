  #       github: "WPDevelopers/twitter-cards-meta"
  #       source: "${plugins_home}/twitter-cards-meta"


# ---------------------------------------------------------------------------
# MCP servers — which contracts are exposed to LLMs.
# ---------------------------------------------------------------------------
mcp:
  wp:
    enabled: true
    # Generate at /wp-admin/profile.php → "Application Passwords" after
    # `./sb install`. Required for wp_rest tool only.
    application_password: ""

  browser:
    enabled: false           # Phase 2 — Playwright-driven
  figma:
    enabled: false           # Phase 3 — official Figma MCP

