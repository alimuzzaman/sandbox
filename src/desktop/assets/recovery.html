<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox — Backend unavailable</title>
  <link rel="stylesheet" href="/recovery.css">
</head>
<body>
  <main>
    <img src="/icon.svg" alt="" width="72" height="72">
    <p class="eyebrow">SANDBOX DESKTOP</p>
    <h1>Backend unavailable</h1>
    <p class="summary">Start the configured Sandbox dashboard, then reconnect. The desktop app never starts Docker or runs arbitrary commands on your behalf.</p>
    <pre id="reason">Waiting for the local backend…</pre>
    <button id="retry" type="button">Reconnect</button>
    <p class="hint">Default endpoint: <code>http://127.0.0.1:8765</code></p>
  </main>
  <script src="/recovery.js"></script>
</body>
</html>
